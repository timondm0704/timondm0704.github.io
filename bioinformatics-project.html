<div id="readme">Loading project description…</div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
  fetch("https://raw.githubusercontent.com/timondm0704/nextflow_wgs_variant_calling/main/README.md?t=" + Date.now(), { cache: "no-store" })
    .then(function (response) { return response.text(); })
    .then(function (markdown) {
      var readme = document.getElementById("readme");
      readme.innerHTML = marked.parse(markdown);

      // Move the first image (the workflow chart) into the sticky area
      var img = readme.querySelector("img");
      if (img) {
        var holder = img.parentElement;
        document.getElementById("workflow-figure").appendChild(img);
        if (holder && holder.tagName === "P" && holder.textContent.trim() === "") {
          holder.remove();
        }
      }
    })
    .catch(function () {
      document.getElementById("readme").innerHTML =
        'Could not load the project description. <a href="https://github.com/timondm0704/nextflow_wgs_variant_calling">View it on GitHub</a>.';
    });
</script>
