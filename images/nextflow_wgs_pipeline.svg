<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect width="900" height="260" fill="#ffffff"/>
  <!-- inputs -->
  <rect x="10" y="40" width="120" height="50" rx="6" fill="#f2f2f2" stroke="#999"/>
  <text x="70" y="62" font-size="13" text-anchor="middle" fill="#222">Paired-end</text>
  <text x="70" y="79" font-size="13" text-anchor="middle" fill="#222">FASTQ reads</text>
  <rect x="10" y="160" width="120" height="50" rx="6" fill="#f2f2f2" stroke="#999"/>
  <text x="70" y="182" font-size="13" text-anchor="middle" fill="#222">Reference</text>
  <text x="70" y="199" font-size="13" text-anchor="middle" fill="#222">genome</text>
  <!-- steps -->
  <g font-size="14" text-anchor="middle">
    <rect x="170" y="40" width="130" height="50" rx="6" fill="#e3edf7" stroke="#3b6ea5"/>
    <text x="235" y="62" font-weight="bold" fill="#1f3f66">TRIM</text>
    <text x="235" y="80" font-size="12" fill="#333">cutadapt</text>
    <rect x="170" y="160" width="130" height="50" rx="6" fill="#e3edf7" stroke="#3b6ea5"/>
    <text x="235" y="182" font-weight="bold" fill="#1f3f66">INDEX</text>
    <text x="235" y="200" font-size="12" fill="#333">bwa, samtools</text>
    <rect x="340" y="100" width="130" height="50" rx="6" fill="#e3edf7" stroke="#3b6ea5"/>
    <text x="405" y="122" font-weight="bold" fill="#1f3f66">ALIGN</text>
    <text x="405" y="140" font-size="12" fill="#333">bwa mem, samtools</text>
    <rect x="510" y="100" width="140" height="50" rx="6" fill="#e3edf7" stroke="#3b6ea5"/>
    <text x="580" y="122" font-weight="bold" fill="#1f3f66">COVERAGE</text>
    <text x="580" y="140" font-size="12" fill="#333">samtools coverage</text>
    <rect x="700" y="40" width="150" height="50" rx="6" fill="#e3edf7" stroke="#3b6ea5"/>
    <text x="775" y="62" font-weight="bold" fill="#1f3f66">CALL_VARIANTS</text>
    <text x="775" y="80" font-size="12" fill="#333">bcftools</text>
  </g>
  <rect x="700" y="160" width="150" height="50" rx="6" fill="#fbeaea" stroke="#b55"/>
  <text x="775" y="182" font-size="13" text-anchor="middle" fill="#822">&lt; 12x: excluded</text>
  <text x="775" y="199" font-size="12" text-anchor="middle" fill="#822">(S4_ind2, 5.8x)</text>
  <!-- output -->
  <text x="775" y="22" font-size="13" text-anchor="middle" fill="#222">cohort.vcf.gz (40 SNPs)</text>
  <!-- arrows -->
  <g stroke="#555" stroke-width="1.6" fill="none" marker-end="url(#arr)">
    <line x1="130" y1="65" x2="168" y2="65"/>
    <line x1="130" y1="185" x2="168" y2="185"/>
    <path d="M300,65 C320,65 320,115 338,115"/>
    <path d="M300,185 C320,185 320,135 338,135"/>
    <line x1="470" y1="125" x2="508" y2="125"/>
    <path d="M650,115 C675,115 675,65 698,65"/>
    <path d="M650,135 C675,135 675,185 698,185"/>
    <line x1="775" y1="40" x2="775" y2="28"/>
  </g>
  <text x="664" y="80" font-size="12" fill="#2a6b2a" text-anchor="end">≥ 12x</text>
  <text x="664" y="178" font-size="12" fill="#822" text-anchor="end">&lt; 12x</text>
</svg>
